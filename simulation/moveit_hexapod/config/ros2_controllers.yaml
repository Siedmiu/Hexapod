# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    leg1_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    leg2_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    leg3_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    leg4_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    leg5_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    leg6_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    whole_body_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

leg1_controller:
  ros__parameters:
    joints:
      - leg1_joint1
      - leg1_joint2
      - leg1_joint3
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    allow_nonzero_velocity_at_trajectory_end: true
